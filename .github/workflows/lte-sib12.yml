name: LTE SIB12 ZMQ 수신
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: lte-sib12-${{ github.ref }}
  cancel-in-progress: true
env:
  LAB_BUILD_JOBS: 4
  LAB_BUILD_MEMORY: 8g
jobs:
  lte-zmq:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/build-lte-docker.sh
      - name: 한글 LTE SIB12 수신과 정상 종료
        run: |
          mkdir -p artifacts/lte-sib12/docker
          docker create --name lte-sib12-check --network none --cap-drop ALL --memory 3g --cpus 4 \
            pws-lab-lte:0.1.0 receive --timeout 60 --output /lab/output/lte-sib12
          timeout 100s docker start -a lte-sib12-check > artifacts/lte-sib12/docker/result.json
          test "$(docker inspect -f '{{.State.ExitCode}}' lte-sib12-check)" = 0
      - name: 성공·실패 원본 로그 보존
        if: always()
        run: |
          mkdir -p artifacts/lte-sib12/docker
          docker cp lte-sib12-check:/lab/output/lte-sib12 artifacts/lte-sib12/docker/runtime || true
          docker rm -f lte-sib12-check || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lte-sib12
          path: artifacts/lte-sib12/
          retention-days: 14
