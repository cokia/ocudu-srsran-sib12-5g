name: PWS ZMQ 수신과 radio plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: pws-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pws-zmq:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: build
        run: bash scripts/build-pws-integration-docker.sh
      - name: 한글 SIB8 실제 수신
        run: |
          mkdir -p artifacts/pws-integration
          docker create --name pws-zmq-check --network none --cap-drop ALL --memory 3g --cpus 4 \
            --entrypoint python pws-lab-zmq:0.1.0 -m controller.pws_integration \
            receive --profile korean-safety --timeout 60 --output /lab/output/pws-integration
          timeout 100s docker start -a pws-zmq-check > artifacts/pws-integration/docker-result.json
          test "$(docker inspect -f '{{.State.ExitCode}}' pws-zmq-check)" = 0
      - name: plugin mock stream
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/radio-plugin
          docker create --name radio-mock-check --network none --cap-drop ALL --memory 2g --cpus 2 \
            pws-lab-radio-plugin:0.1.0
          timeout 45s docker start -a radio-mock-check > artifacts/radio-plugin/docker-result.json
          test "$(docker inspect -f '{{.State.ExitCode}}' radio-mock-check)" = 0
      - name: 성공·실패 원본 로그 보존
        if: always()
        run: |
          mkdir -p artifacts/pws-integration artifacts/radio-plugin
          docker cp pws-zmq-check:/lab/output/pws-integration artifacts/pws-integration/runtime || true
          docker cp radio-mock-check:/lab/output/radio-plugin artifacts/radio-plugin/runtime || true
          docker rm -f pws-zmq-check radio-mock-check || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pws-radio-integration
          path: artifacts/
          retention-days: 14
