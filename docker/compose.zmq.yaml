name: ocudu-pws-lab-zmq
services:
  reception:
    image: pws-lab-zmq:0.1.0
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 3g
    cpus: 4
    pids_limit: 256
    stop_grace_period: 25s
    volumes:
      - ../configs:/lab/configs:ro
      - zmq-output:/lab/output
volumes:
  zmq-output:
