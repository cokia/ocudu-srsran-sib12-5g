name: ocudu-pws-integration
services:
  reception:
    profiles: [pws-zmq]
    image: pws-lab-zmq:0.1.0
    entrypoint: [python, -m, controller.pws_integration]
    command: [receive, --profile, korean-safety, --timeout, '60', --output, /lab/output/pws]
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 3g
    cpus: 4
    pids_limit: 256
    stop_grace_period: 25s
    volumes:
      - ../configs:/lab/configs:ro
      - pws-output:/lab/output
  radio-mock:
    profiles: [radio-mock]
    image: pws-lab-radio-plugin:0.1.0
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 15s
    volumes:
      - ../configs:/lab/configs:ro
      - radio-output:/lab/output
volumes:
  pws-output:
  radio-output:
