# upstream의 공개 시험용 soft USIM 값. 실제 가입자 credential이 아니다.
[rf]
device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,id=ue,base_srate=23.04e6
srate = 23.04e6
nof_antennas = 1
tx_gain = 0
rx_gain = 0
freq_offset = 0
time_adv_nsamples = 0
[rat.eutra]
nof_carriers = 0
[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106
dl_nr_arfcn = 368500
ssb_nr_arfcn = 368410
scs = 15
ssb_scs = 15
[rrc]
release = 15
ue_category = 4
[usim]
mode = soft
algo = milenage
opc = 63BFA50EE6523365FF14C1F45F88737D
k = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319
[nas]
apn = srsapn
apn_protocol = ipv4
[log]
filename = stdout
all_level = warning
rrc_level = info
all_hex_limit = 0
[phy]
nof_phy_threads = 1
[pcap]
enable = none
