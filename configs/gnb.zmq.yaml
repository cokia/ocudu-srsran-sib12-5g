# ZMQ 전용 NR 수신 시험. 실제 AMF/SDR/PWS 입력이 없는 고정 profile.
cu_cp:
  amf:
    no_core: true
    addrs: 127.0.0.1
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: '00101'
            tai_slice_support_list:
              - sst: 1
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 0
  rx_gain: 0
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: '00101'
  tac: 7
  pci: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
log:
  filename: stdout
  all_level: info
pcap:
  mac_enable: false
  ngap_enable: false
buffer_pool:
  nof_segments: 16384
  segment_size: 2048
expert_execution:
  threads:
    main_pool:
      nof_threads: 2
